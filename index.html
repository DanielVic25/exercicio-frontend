<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construção de FrontEnd Exercicio - 01</title> 
</head> 
<body>
    <!-- Exercício 01 - Colocar 3 parágrafo e altera acor pelo javascritp. -->
    <h1>Exercício 01</h1>
    <p>Parágrafo 1</p>
    <p>Parágrafo 2</p>
    <p>Parágrafo 3</p>
    <hr>

    <!-- Exercício 02 - Criar um botão para mostrar as horas atuais. -->
    <h1>Exercício 02</h1>
    <button id="botaoHoras">Mostrar Horas</button>
    <P id="resultadoHoras"></P>
    <hr>

    <!-- Exercicio 03 - Mostar no input em tempo real o texto digitado. -->
    <h1>Exercício 03</h1>
    <input type="text" id="inputTexto" placeholder="Digite algo ">
    <p id="resultadoTexto"></p>
    <hr>

    <!-- Exercício 04 - Mostrar um texto de saudação com o nome da pessoa no input em letra maiúscula. -->
    <h1>Exercício 04</h1>
    <input type="text" id="inputSaudacao" placeholder="Digite uma saudação">
    <p id="resultadoSaudacao"></p>

    <hr>

<!-- Exercício 05 - Lista de frutas em CSV -->
<h1>Exercício 05</h1>
<button id="botaoFrutas">Mostrar Frutas</button>
<p id="resultadoFrutas"></p>
<hr>

<!-- Exercício 06 - Mini calculadora -->
<h1>Exercício 06</h1>
<input type="number" id="inputNumero1" placeholder="Digite o primeiro número"> </br>
<input type="number" id="inputNumero2" placeholder="Digite o segundo número">
<button id="botaoCalculadora">Calcular</button>
<p id="resultadoCalculadora"></p>
<hr>

<!-- Exercício 07 - Soma de dois inputs -->
<h1>Exercício 07</h1>
<input type="number" id="numero1" placeholder="Digite o primeiro número"> </br>
<input type="number" id="numero2" placeholder="Digite o segundo número">
<button id="botaoSomar">Somar</button>
<p id="resultadoSoma"></p>
<hr>

<!-- Exercício 08 - Maior número -->
<h1>Exercício 08</h1>
<button id="botaoMaior">Mostrar Maior Número</button>
<p id="resultadoMaior"></p>
<hr>

<!-- Exercício 09 - Formulário com preventDefault -->
<h1>Exercício 09</h1>
<form id="formulario">
    <input type="text" id="nome" placeholder="Digite seu nome"> </br>
    <input type="email" id="email" placeholder="Digite seu email">
    <button type="submit">Enviar</button>
</form>
<p id="resultadoFormulario"></p>
<hr>

<!-- Exercício 10 - Calculadora de horas e cursos -->
<h1>Exercício 10</h1>
<input type="number" id="horasCurso" placeholder="Digite as horas"> </br>
<input type="number" id="valorHora" placeholder="Digite o valor por hora"> </br>
<input type="number" id="numeroCursos" placeholder="Digite a quantidade de cursos"> </br>

<button id="botaoCurso">Calcular Valor</button>
<p id="resultadoCurso"></p>

</body>
<script src="script.js"></script>
</html>
